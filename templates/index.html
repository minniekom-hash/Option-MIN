
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPTION TRADE | Omniscience Weekly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #0b0f1a; color: #e2e8f0; }
        .trading-card { background: linear-gradient(145deg, #161e2d, #0b0f1a); border: 1px solid #2d3748; }
        .verdict-strong { background-color: #065f46; color: #34d399; box-shadow: 0 0 10px rgba(52, 211, 153, 0.3); }
        .verdict-spec { background-color: #92400e; color: #fbbf24; }
        .verdict-avoid { background-color: #7f1d1d; color: #f87171; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div class="text-center md:text-left">
                <h1 class="text-4xl font-bold text-blue-500 tracking-tight">OPTION TRADE <span class="text-sm bg-blue-900 text-blue-200 px-2 py-1 rounded ml-2">Omniscience Weekly</span></h1>
                <p class="text-slate-400 mt-2">วิเคราะห์บูรณาการ: <span class="text-blue-300">Flow + Sentiment + Momentum + Greeks</span> | <span class="text-blue-300 font-bold">เวลาไทย GMT+7</span></p>
            </div>
            <div id="status" class="bg-slate-800 px-6 py-2 rounded-full border border-slate-600 text-sm font-mono">
                กำลังเชื่อมต่อข้อมูลโลก...
            </div>
        </header>
        <div id="table-container" class="trading-card rounded-3xl shadow-2xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-800/80 text-slate-300 text-xs uppercase tracking-widest">
                    <tr class="border-b border-slate-700">
                        <th class="p-5">Ticker</th>
                        <th class="p-5 text-center">Price</th>
                        <th class="p-5 text-center">Type</th>
                        <th class="p-5 text-center">Weekly Strike</th>
                        <th class="p-5 text-center">Verdict</th>
                        <th class="p-5 text-left">Analysis & News</th>
                        <th class="p-5 text-right">Probability</th>
                    </tr>
                </thead>
                <tbody id="scanner-body" class="divide-y divide-slate-800"></tbody>
            </table>
        </div>
    </div>
    <script>
        async function updateData() {
            try {
                const response = await fetch('/data');
                const result = await response.json();
                const body = document.getElementById('scanner-body');
                body.innerHTML = '';
                result.data.forEach(item => {
                    const typeColor = item.type === 'Call' ? 'bg-green-900 text-green-300' : 'bg-red-900 text-red-300';
                    const glowColor = item.type === 'Call' ? 'text-green-400' : 'text-red-400';
                    let verdictClass = 'verdict-avoid';
                    if(item.verdict === '🔥 STRONG BUY') verdictClass = 'verdict-strong';
                    else if(item.verdict === '⚡ SPECULATIVE') verdictClass = 'verdict-spec';
                    body.innerHTML += `
                        <tr class="hover:bg-slate-800/40 transition-all">
                            <td class="p-5 font-bold text-lg text-white">${item.ticker}</td>
                            <td class="p-5 text-center font-mono text-slate-300">$${item.price}</td>
                            <td class="p-5 text-center"><span class="px-3 py-1 rounded-full text-xs font-bold ${typeColor}">${item.type}</span></td>
                            <td class="p-5 text-center font-bold text-blue-400 text-lg">$${item.strike}</td>
                            <td class="p-5 text-center"><span class="px-4 py-1 rounded-full text-xs font-bold ${verdictClass}">${item.verdict}</span></td>
                            <td class="p-5">
                                <div class="text-sm font-semibold text-blue-300 mb-1">${item.news}</div>
                                <div class="text-xs text-slate-500">${item.reason}</div>
                            </td>
                            <td class="p-5 text-right font-bold text-2xl ${glowColor}">${item.winRate}</td>
                        </tr>`;
                });
                document.getElementById('status').innerHTML = '🟢 ระบบทำงานปกติ | เวลาไทย: ' + result.time_th;
            } catch (e) {
                document.getElementById('status').innerHTML = '🔴 Connection Error';
            }
        }
        setInterval(updateData, 30000);
        updateData();
    </script>
</body>
</html>
